<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <!-- Pre-paint theme guard: set the .dark class from saved prefs BEFORE React
         mounts so there's no light/dark flash. Mirrors lib/preferences.ts
         (LS key + ThemeChoice) and lib/useTheme.ts (resolution logic). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("image-horse-prefs");
          var theme = "dark";
          if (raw) {
            var t = JSON.parse(raw).theme;
            if (t === "light" || t === "dark" || t === "system") theme = t;
          }
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var el = document.documentElement;
          el.classList.toggle("dark", dark);
          el.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#121212" : "#f3efe8");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="icon" href="/Image-Horse-Logo.svg" type="image/svg+xml" />

    <!-- The editor is a single page behind a canvas: there is no text here for a
         crawler to rank, and the marketing site at imagehorse.app is what should
         answer a search. So this is not indexed — without the noindex the two
         hosts compete for the same brand query and the one that wins is the one
         with nothing on it. `follow` still lets the link equity pass through.
         The canonical is self-referential rather than pointing at imagehorse.app:
         a canonical to a page with different content is ignored, and pointing an
         app at a marketing page is exactly that case. -->
    <title>Image Horse — browser photo editor</title>
    <meta
      name="description"
      content="Crop, compress, annotate and edit photos in your browser. Editing runs on your own machine in WebAssembly."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://edit.imagehorse.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Image Horse" />
    <meta property="og:title" content="Image Horse — browser photo editor" />
    <meta
      property="og:description"
      content="Crop, compress, annotate and edit photos in your browser. Editing runs on your own machine in WebAssembly."
    />
    <meta property="og:url" content="https://edit.imagehorse.app/" />
    <meta property="og:image" content="https://imagehorse.app/og/default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are SELF-HOSTED (app/src/fonts.css, files in public/fonts).
         This used to <link> fonts.googleapis.com, which put every visitor's IP
         in front of Google before they clicked anything — logged out included —
         while /architecture said the demo tier was "No account, no network". -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

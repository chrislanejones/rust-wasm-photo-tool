<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- seo:start -->
    <!-- Everything from seo:start through seo:end is REPLACED, per route, by
         scripts/prerender.mjs, which reads the values from src/seo.ts. So a title
         or description edited here changes only what `vite dev` shows; the built
         site takes its own from the route table. This note sits INSIDE the markers
         on purpose — outside them it would survive into all five built pages.
         Do not remove the markers: the prerender step throws if it cannot find
         them, rather than silently shipping five copies of this shell. -->
    <title>Image Horse — private photo editor that runs in your browser</title>
    <meta
      name="description"
      content="Crop, compress, annotate and batch-edit photos without uploading them. A Rust and WebAssembly image editor that runs on your own machine — no account needed."
    />
    <!-- seo:end -->

    <meta name="theme-color" content="#1b1210" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted, and preloaded so they arrive with the stylesheet instead of
         after it. The @font-face rules are in src/tokens.css. These were a
         Google Fonts <link>, a render-blocking stylesheet on a second origin
         (Lighthouse estimated about 0.9 s of mobile first paint), and the
         late swap reflowed the headline: 701 to 882 px wide at 1.4 s on a
         local desktop load. Only the latin files are preloaded, since every
         page needs them. The latin-ext files load only when a page uses a
         character from that range. -->
    <link rel="preload" href="/fonts/geist-latin-v5.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-v24.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[build]
  # ⚠️ A SECOND, STALE COPY OF THIS COMMAND LIVES IN THE NETLIFY UI (#56).
  # Read 2026-09-04 via `netlify api getSite` — `build_settings.cmd` is still
  # the pre-ADR-038 version:
  #
  #   curl … --default-toolchain stable && cargo install wasm-pack &&
  #   wasm-pack build --target web --out-dir pkg && cd app && pnpm ci &&
  #   pnpm run build
  #
  # Three things wrong with it, in descending order of damage:
  #   1. NO `--features tiles,patchmatch` — that is the v7.36–v7.45 bug, where
  #      Netlify shipped a FEATURELESS wasm for ten releases.
  #   2. `--default-toolchain stable` and an unpinned `cargo install wasm-pack`
  #      — the exact two drifts ADR-038 and v8.63's CI pin closed.
  #   3. `pnpm ci` is not a pnpm command at all.
  #
  # THIS FILE WINS TODAY. netlify.toml's `command` overrides the UI setting, and
  # the shipped wasm proves it: 816,971 B live, against 720,904 B for a measured
  # featureless build and an 800,000–840,000 B sentinel band (ADR-045, which
  # narrowed ADR-037's). The "Deploy sentinel (live prod engine)" job is green.
  #
  # So this is a loaded gun, not a live fire. It goes off if netlify.toml is
  # renamed, moved under a `base` subdirectory where Netlify cannot see it, or
  # if anyone edits the build command in the UI. The fix is to CLEAR the UI
  # command so there is one source of truth — a production-settings change, so
  # it needs a human. Same shape as the wasm-pack drift: two sources for one
  # build, and the invisible one is the one that rots.
  #
  # ⚠️ TWO PINS LIVE IN THIS COMMAND. Both exist so the shipped wasm is a
  # function of the repository and nothing else — see ADR-038.
  #
  # 1. `--default-toolchain none`. This used to say `stable`, which installed
  #    whatever Rust shipped that day and THEN let rust-toolchain.toml pull
  #    1.97.1 as well — two toolchains downloaded, one of them never used.
  #    The BINARY was never at risk: `RUSTUP_TOOLCHAIN` went away in v8.53, so
  #    the pin file already won every compile. This is a wasted download and a
  #    misleading install line, not a mis-built artifact.
  #    `none` installs rustup and no toolchain, so the pin file is the only
  #    thing that decides; cargo installs it on first use and the log says so.
  #    Do NOT put a version here instead — that is a second place to update,
  #    and it is the one that drifts.
  #    ⚠️ THIS REMOVES THE FALLBACK, deliberately. With no rust-toolchain.toml
  #    (deleted, or a Netlify `base` subdirectory that cannot see it) the build
  #    now FAILS with "no default toolchain" instead of quietly compiling under
  #    whatever `stable` happens to be. Failing loud is the point: silent
  #    compiler drift is the bug ADR-038 exists to close.
  #
  # 2. `wasm-pack --version`. `cargo install wasm-pack` unpinned takes the
  #    latest release, so the tool that runs wasm-opt could change under a
  #    build with no commit — the same class of drift the toolchain pin closed.
  #    0.14.0 -> 0.15.0 was measured as byte-identical output (v8.53), so this
  #    pin costs nothing today; it is here to keep the binary reproducible.
  #    `--locked` makes it honour wasm-pack's own lockfile too.
  command = """
    curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain none &&
    source $HOME/.cargo/env &&
    cargo install wasm-pack --version 0.15.0 --locked &&
    ./scripts/build-wasm.sh &&
    pnpm install &&
    pnpm --filter stamp-tool build
  """
  publish = "www-dist"

[build.environment]
  # ⚠️ RUSTUP_TOOLCHAIN is deliberately ABSENT. It OVERRIDES rust-toolchain.toml
  # (verified: `RUSTUP_TOOLCHAIN=stable rustup show` reports "overridden by
  # environment variable"), so setting it here would have made the pin a no-op
  # on the one builder that actually ships. See ADR-038. Do not reintroduce it.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
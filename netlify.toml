[build]
  # ⚠️ A SECOND, STALE COPY OF THIS COMMAND LIVES IN THE NETLIFY UI (#56).
  # Read 2026-09-04 via `netlify api getSite` — `build_settings.cmd` is still
  # the pre-ADR-038 version:
  #
  #   curl … --default-toolchain stable && cargo install wasm-pack &&
  #   wasm-pack build --target web --out-dir pkg && cd app && pnpm ci &&
  #   pnpm run build
  #
  # Three things wrong with it, in descending order of damage:
  #   1. NO `--features tiles,patchmatch` — that is the v7.36–v7.45 bug, where
  #      Netlify shipped a FEATURELESS wasm for ten releases.
  #   2. `--default-toolchain stable` and an unpinned `cargo install wasm-pack`
  #      — the exact two drifts ADR-038 and v8.63's CI pin closed.
  #   3. `pnpm ci` is not a pnpm command at all.
  #
  # THIS FILE WINS TODAY. netlify.toml's `command` overrides the UI setting, and
  # the shipped wasm proves it: 816,971 B live, against 720,904 B for a measured
  # featureless build and an 800,000–840,000 B sentinel band (ADR-045, which
  # narrowed ADR-037's). The "Deploy sentinel (live prod engine)" job is green.
  #
  # So this is a loaded gun, not a live fire. It goes off if netlify.toml is
  # renamed, moved under a `base` subdirectory where Netlify cannot see it, or
  # if anyone edits the build command in the UI. The fix is to CLEAR the UI
  # command so there is one source of truth — a production-settings change, so
  # it needs a human. Same shape as the wasm-pack drift: two sources for one
  # build, and the invisible one is the one that rots.
  #
  # ⚠️ TWO PINS LIVE IN THIS COMMAND. Both exist so the shipped wasm is a
  # function of the repository and nothing else — see ADR-038.
  #
  # 1. `--default-toolchain none`. This used to say `stable`, which installed
  #    whatever Rust shipped that day and THEN let rust-toolchain.toml pull
  #    1.97.1 as well — two toolchains downloaded, one of them never used.
  #    The BINARY was never at risk: `RUSTUP_TOOLCHAIN` went away in v8.53, so
  #    the pin file already won every compile. This is a wasted download and a
  #    misleading install line, not a mis-built artifact.
  #    `none` installs rustup and no toolchain, so the pin file is the only
  #    thing that decides; cargo installs it on first use and the log says so.
  #    Do NOT put a version here instead — that is a second place to update,
  #    and it is the one that drifts.
  #    ⚠️ THIS REMOVES THE FALLBACK, deliberately. With no rust-toolchain.toml
  #    (deleted, or a Netlify `base` subdirectory that cannot see it) the build
  #    now FAILS with "no default toolchain" instead of quietly compiling under
  #    whatever `stable` happens to be. Failing loud is the point: silent
  #    compiler drift is the bug ADR-038 exists to close.
  #
  # 2. `wasm-pack --version`. `cargo install wasm-pack` unpinned takes the
  #    latest release, so the tool that runs wasm-opt could change under a
  #    build with no commit — the same class of drift the toolchain pin closed.
  #    0.14.0 -> 0.15.0 was measured as byte-identical output (v8.53), so this
  #    pin costs nothing today; it is here to keep the binary reproducible.
  #    `--locked` makes it honour wasm-pack's own lockfile too.
  command = """
    curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain none &&
    source $HOME/.cargo/env &&
    cargo install wasm-pack --version 0.15.0 --locked &&
    ./scripts/build-wasm.sh &&
    pnpm install &&
    pnpm --filter stamp-tool build &&
    ./scripts/write-build-info.sh www-dist
  """
  publish = "www-dist"

[build.environment]
  # ⚠️ RUSTUP_TOOLCHAIN is deliberately ABSENT. It OVERRIDES rust-toolchain.toml
  # (verified: `RUSTUP_TOOLCHAIN=stable rustup show` reports "overridden by
  # environment variable"), so setting it here would have made the pin a no-op
  # on the one builder that actually ships. See ADR-038. Do not reintroduce it.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
# ── Security headers ─────────────────────────────────────────────────────────
# Added 2026-09-07. Before this the site sent HSTS and nothing else.
#
# The four below are ENFORCING from the start — they are uncontroversial for a
# client-side editor and none of them can break a working page.
#
# The Content-Security-Policy is REPORT-ONLY, deliberately, and must stay that
# way until a human has watched the report stream through a real editing
# session. A wrong CSP passes every local gate and every CI job and then breaks
# the editor in production only — there is no test in this repo that would
# catch it, because nothing local serves these headers.
#
# ⚠️ THE TWO DIRECTIVES THAT WOULD KILL THE EDITOR IF WRONG
#
#   'wasm-unsafe-eval'  in script-src. The engine is WebAssembly, and
#                       instantiating it counts as eval to CSP. Without this the
#                       canvas never comes up at all.
#   worker-src 'self' blob:
#                       OUR two workers are same-origin — Vite's
#                       `new Worker(new URL(..., import.meta.url))` emits asset
#                       files, verified 2026-09-07 (engine.worker-*.js and
#                       codec.worker-*.js both 200). So `'self'` covers the
#                       engine and `blob:` is NOT for us.
#                       ⚠️ `blob:` is here for CLERK, which builds its own
#                       workers from blob URLs — found by the report stream on
#                       the first real page load, not by reading our code.
#                       Neither the code inventory nor the bundle grep would
#                       ever have shown this: it happens inside a third-party
#                       script at runtime.
#
# ⚠️ THE INLINE SCRIPT HASH. app/index.html carries ONE inline <script> — the
# anti-FOUC theme setter, which has to be inline or the page flashes the wrong
# theme before first paint. It is allowed by SHA-256 hash rather than
# 'unsafe-inline', because 'unsafe-inline' would re-open script injection for
# the sake of twelve lines.
#
# The hash is brittle BY DESIGN: change one character of that script — even
# whitespace — and the hash no longer matches, and under an enforcing policy the
# theme setter silently stops running. `pnpm -C app test` has a guard that
# recomputes it from index.html and fails if this file disagrees, so the drift
# is caught in CI rather than as a flash of the wrong theme in production.
#
# CONNECT-SRC ORIGINS — inventoried from a real live session's resource timing,
# not from imports:
#   self                          the app, its assets and its wasm
#   *.clerk.accounts.dev          auth (the DEV instance; prod talks to it too)
#   *.convex.cloud + wss:         backend, both deployments this project uses
#   ufs.sh                        UploadThing — the sample images load from it
#   fonts.googleapis/gstatic      the font CSS and the font files
#   cdn.jsdelivr.net              ⚠️ emoji-mart fetches its data set at runtime
#                                 (`@emoji-mart/data@latest/sets/…`). Found in
#                                 the shipped bundle, NOT reproduced in a live
#                                 session — the emoji picker was not opened. If
#                                 the report stream never mentions jsdelivr,
#                                 this line can go.
#
# img-src needs `blob:` and `data:` — every thumbnail, preview and export is a
# blob URL (URL.createObjectURL, 8 call sites).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy-Report-Only = """\
default-src 'self'; \
script-src 'self' 'wasm-unsafe-eval' 'sha256-2kzO0RCVLXlFIInFPo4scxTQKGqCV5AmH72rPA4nFK8=' https://*.clerk.accounts.dev; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com data:; \
img-src 'self' blob: data: https://f1avkyiqgj.ufs.sh https://*.ufs.sh; \
connect-src 'self' blob: data: https://*.clerk.accounts.dev https://*.convex.cloud wss://*.convex.cloud https://*.ufs.sh https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; \
worker-src 'self' blob:; \
frame-src 'self' https://*.clerk.accounts.dev; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'none'\
"""

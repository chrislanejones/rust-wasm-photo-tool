[build]
  command = """
    curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable &&
    source $HOME/.cargo/env &&
    cargo install wasm-pack &&
    wasm-pack build --target web -- --features tiles,patchmatch &&
    pnpm install &&
    pnpm --filter stamp-tool build
  """
  publish = "www-dist"

[build.environment]
  # ⚠️ RUSTUP_TOOLCHAIN is deliberately ABSENT. It OVERRIDES rust-toolchain.toml
  # (verified: `RUSTUP_TOOLCHAIN=stable rustup show` reports "overridden by
  # environment variable"), so setting it here would have made the pin a no-op
  # on the one builder that actually ships. See ADR-038. Do not reintroduce it.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
name: CI

# One workflow, all checks. Build/quality jobs run on push + PR; the security
# jobs (audits, secret scan, CodeQL) also run on a weekly cron, because new CVEs
# are disclosed independent of your commits.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: # so the deploy sentinel can be run on demand

permissions:
  contents: read

jobs:
  # ---------- Quality / build ----------
  rust:
    name: Rust / WASM
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # no point rebuilding on the cron
    outputs:
      # The SHIPPED configuration's sha256, for the deploy sentinel's tier-2
      # reproducibility check (ADR-046): CI's build of this commit must equal
      # Netlify's build of this commit, byte for byte.
      wasm_sha256: ${{ steps.wasm.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from rust-toolchain.toml (ADR-038), not from a floating
      # `@stable` — that is the whole point of the pin. `rustup show` installs
      # and selects it, and prints which one, so the log says what compiled.
      # Components (clippy, rustfmt) are declared in the toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --features tiles so the tile-engine core (src/tiles.rs, src/ops.rs)
      # and its tests/*.rs replay-parity suite actually get linted/run, not
      # silently skipped — the feature is off by default and NOT part of the
      # wasm build (see the wasm-pack step below, which stays feature-free).
      - run: cargo clippy --all-targets --features tiles -- -D warnings
      - run: cargo test --features tiles
      # PINNED. The action defaults to `version: latest`, and on 2026-09-02
      # "latest" resolved to v0.15.0 at 03:04 UTC and to **v0.9.1** at 03:22 —
      # same workflow, same commit base, eighteen minutes apart. v0.9.1 ships a
      # 2020-era wasm-opt that predates reference-types, so the build died on
      # "Only 1 table definition allowed in MVP" with nothing wrong in the repo.
      # A re-run went green on its own, which is the worst version of this bug:
      # it looks like flake and it is actually an unpinned dependency.
      #
      # netlify.toml already pins `cargo install wasm-pack --version 0.15.0`
      # and its comment names this exact risk — "the tool that runs wasm-opt
      # could change under a build with no commit." That pin was applied to
      # Netlify and never here, so the two halves of the same build disagreed.
      # 0.15.0 is chosen because it is what Netlify pins and what produced every
      # shipped binary; wasm-opt affects the output size the deploy sentinel
      # bounds (ADR-037), so this is the version that keeps CI and prod honest.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      # Through the one wrapper every builder uses (scripts/build-wasm.sh): it
      # refuses any wasm-opt other than binaryen 117 on PATH, refuses an env
      # RUSTFLAGS, and proves the artifact was actually rewritten. ADR-038's
      # correction explains why the OPTIMIZER needed pinning after rustc and
      # wasm-pack already were. IH_WASM_FEATURES="" keeps this build
      # feature-free, as the comment above says it must.
      - run: IH_WASM_FEATURES= ./scripts/build-wasm.sh
      # And the SHIPPED configuration (tiles,patchmatch), whose sha256 the
      # deploy sentinel compares against Netlify's build of the same commit.
      # Second build, ~1 min: the cost of proving two machines agree.
      - name: Build the shipped configuration and record its sha256
        id: wasm
        run: |
          ./scripts/build-wasm.sh
          echo "sha256=$(sha256sum pkg/stamp_tool_bg.wasm | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  web:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    needs: rust
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show   # toolchain pinned by rust-toolchain.toml (ADR-038)
      - uses: Swatinem/rust-cache@v2
      # PINNED. The action defaults to `version: latest`, and on 2026-09-02
      # "latest" resolved to v0.15.0 at 03:04 UTC and to **v0.9.1** at 03:22 —
      # same workflow, same commit base, eighteen minutes apart. v0.9.1 ships a
      # 2020-era wasm-opt that predates reference-types, so the build died on
      # "Only 1 table definition allowed in MVP" with nothing wrong in the repo.
      # A re-run went green on its own, which is the worst version of this bug:
      # it looks like flake and it is actually an unpinned dependency.
      #
      # netlify.toml already pins `cargo install wasm-pack --version 0.15.0`
      # and its comment names this exact risk — "the tool that runs wasm-opt
      # could change under a build with no commit." That pin was applied to
      # Netlify and never here, so the two halves of the same build disagreed.
      # 0.15.0 is chosen because it is what Netlify pins and what produced every
      # shipped binary; wasm-opt affects the output size the deploy sentinel
      # bounds (ADR-037), so this is the version that keeps CI and prod honest.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stamp-tool exec tsc -b --noEmit
      # Blocking, not advisory. `pnpm lint` is errors-only by design (warnings
      # are a visible backlog, currently 61) — do NOT add --max-warnings 0 here;
      # it was in CLAUDE.md for months while no eslint config or dependency
      # existed, so the "gate" silently exited on config-not-found every run.
      - run: pnpm lint
      # ORDER MATTERS: the suite must run AFTER build:all, not before it.
      # `useKeyboardShortcuts.test.ts` transitively imports lib/photoLimits.ts,
      # which does `await import("stamp_tool")` — the WASM package that only
      # exists once `build:wasm` has produced pkg/. Running tests first fails
      # with "Failed to resolve import stamp_tool", which looks like a broken
      # test and is actually a missing build artifact. It passed locally only
      # because pkg/ was already on disk; reproduced by moving pkg/ aside.
      # (The `rust` job builds pkg/ too, but jobs don't share a filesystem.)
      - run: pnpm run build:all
      - run: pnpm -C app test

  # Asserts the LIVE site is serving a real engine — not that a build succeeded.
  # From v7.36 to v7.45 netlify.toml ran a bare `wasm-pack build` with no
  # --features, so prod shipped a WASM with no tiles/op-log for five weeks. It
  # never crashed: the runtime feature-detects quietly took the fallback path,
  # so every "shipped ON" flag was off for real users while every local build
  # was green. HTTP 200 proved nothing; only fetching the live binary did.
  #
  # Deliberately NOT gated on the current commit: it validates whatever is live
  # right now, so it catches a bad deploy on the weekly cron too, not only on
  # the push that caused it. On push it runs against the PREVIOUS deploy (the
  # new one is still building) — which is fine, the invariant is "prod is never
  # featureless", not "prod matches this SHA".
  deploy-sentinel:
    name: Deploy sentinel (live prod engine)
    runs-on: ubuntu-latest
    # `needs` for the tier-2 expectation; `always()` so the scheduled run —
    # where `rust` is skipped and the outputs are empty — still checks the
    # live site (tier 2 then reports itself skipped, tier 1 still runs).
    needs: [rust]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy-sentinel.sh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_WASM_SHA256: ${{ needs.rust.outputs.wasm_sha256 }}

  marketing:
    name: Marketing build (mirrors Vercel /marketing root)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # Vercel's Root Directory is /marketing, so it reads marketing/vercel.json
    # and runs install+build FROM there. Mirror that exactly rather than driving
    # it from the repo root, so CI fails the same way Vercel would.
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # marketing/vercel.json -> installCommand "pnpm install", buildCommand
      # "pnpm build" (= tsc -b && vite build). pnpm resolves the workspace root
      # for install even when invoked from the subdir.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  convex:
    name: Convex (codegen + typecheck + drift)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `convex codegen` runs Convex's OWN TypeScript check (correct runtime type
      # environment — plain `tsc` falsely reports `process`/global errors on
      # backend code) AND regenerates convex/_generated. It connects to the
      # deployment, so it needs CONVEX_DEPLOY_KEY; the step is skipped on fork
      # PRs where the secret isn't available.
      - name: Convex codegen + typecheck + drift
        if: env.CONVEX_DEPLOY_KEY != ''
        run: |
          pnpm exec convex codegen
          git diff --exit-code convex/_generated \
            || { echo "::error::convex/_generated is stale — run 'npx convex codegen' and commit"; exit 1; }
      - name: Skipped (no CONVEX_DEPLOY_KEY)
        if: env.CONVEX_DEPLOY_KEY == ''
        run: echo "Skipping Convex checks — add the CONVEX_DEPLOY_KEY repo secret to enable."

  # Convex functions do not reach production by merging. Nothing in this
  # workflow pushed them until now: the job above runs `convex codegen`, which
  # typechecks and regenerates `convex/_generated` and deploys NOTHING. So the
  # repo could hold a function, CI could go green, the client could ship a call
  # to it, and prod could have never heard of it.
  #
  # That is not hypothetical. #121 shipped a client calling
  # `userColors:listUserColors`, the function was never deployed, and every
  # signed-in user got a blank screen. When this job was written prod was STILL
  # missing `shares` and `userColors` — both of which the app calls — measured
  # against dev as a control, which had all sixteen modules.
  convex-deploy:
    name: Convex deploy (prod functions)
    runs-on: ubuntu-latest
    # Pushes to master only. A pull request must never be able to change what
    # production runs, and a fork PR cannot read the secret anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Deploy behind the gates that would catch a broken build. `convex` is the
    # one that typechecks the functions being pushed.
    needs: [web, convex]
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # WHERE AM I POINTED? `convex deploy` targets whatever deployment its key
      # belongs to and mentions it only in passing, so a dev-scoped key sitting
      # in this secret would push a green, successful, entirely wrong deploy.
      # This reads the deployment URL back as data and fails before anything is
      # pushed if it is not prod.
      - name: Confirm the target deployment before pushing anything
        if: env.CONVEX_DEPLOY_KEY != ''
        run: node scripts/convex-deploy-check.mjs --expect-deployment https://pastel-alligator-180.convex.cloud

      - name: Deploy functions
        if: env.CONVEX_DEPLOY_KEY != ''
        run: pnpm exec convex deploy --message "CI ${{ github.sha }}"

      # A deploy that silently pushed nothing also exits 0, so the exit code is
      # not the evidence. This asks the deployment what it actually serves and
      # fails if any module in `convex/` is missing from the answer.
      - name: Prove every module is live
        if: env.CONVEX_DEPLOY_KEY != ''
        run: node scripts/convex-deploy-check.mjs

      # ⚠️ NOT a skip. This job only runs on a push to master, so there is no
      # legitimate reason for the secret to be missing here — a fork PR never
      # reaches this job at all.
      #
      # It WAS a skip, for one night, and that was worse than useless: the
      # secret was not set, all three steps above were skipped, and the job
      # reported SUCCESS while deploying nothing. Prod stayed three modules
      # short and master's CI said everything was fine. Green because it could
      # not fail is the exact shape docs/vacuous-checks.md (git history; moved out of the repo 2026-09-17) exists to name.
      - name: Fail if the deploy key is missing
        if: env.CONVEX_DEPLOY_KEY == ''
        run: |
          echo "::error::CONVEX_DEPLOY_KEY is not set, so nothing was deployed."
          echo "Add it as a repository secret (Settings → Secrets and variables → Actions)."
          echo "Get the value from the Convex dashboard: Settings → Deploy keys → Production."
          exit 1

  uploadthing-leak-guard:
    name: UploadThing secret-leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # UPLOADTHING_TOKEN is server-only by design (no VITE_ prefix, see
      # .env.local). This fails the build if client source ever references the
      # token or a VITE_-exposed UploadThing var, which would bundle the secret.
      - name: Assert no client-side UploadThing secret usage
        run: |
          # Only flags patterns that would actually BUNDLE the secret into the
          # client: a VITE_-exposed var or import.meta.env read. A bare mention
          # of UPLOADTHING_TOKEN in a comment is fine, so it's not matched.
          if grep -rniE "VITE_UPLOADTHING|import\.meta\.env\.[A-Za-z_]*UPLOADTHING" \
               app/src marketing/src; then
            echo "::error::Client source references an UploadThing secret — it must stay server-side."
            exit 1
          fi
          echo "OK: no client-side UploadThing secret references."

  # ---------- Security ----------
  cargo-audit:
    name: cargo audit (Rust deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # rustsec/audit-check posts its results as a check-run
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pnpm-audit:
    name: pnpm audit (npm deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-blocking: transitive npm advisories are often unfixable noise for a
      # browser app. Drop the `|| true` once the tree is clean to make it gate.
      - run: pnpm audit --audit-level=high || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so a secret committed earlier is caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (TS/React)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4.38.1
        with:
          language: javascript-typescript
      - uses: github/codeql-action/analyze@v4.38.1

  # ---------- Static guardrails (from docs/ci-guardrails.md (git history; moved out of the repo 2026-09-17)) ----------
  # BLOCKING as of the night-repair pass. These ran under `continue-on-error`
  # on the job AND every step, which meant they reported violations and failed
  # nothing — advisory theater. Flipping them straight to blocking was not an
  # option either: only 1 of the 6 is at zero (112 violations across the rest),
  # and widening the exclude globs to go green is the ratchet anti-pattern the
  # guardrails doc forbids.
  #
  # So scripts/guardrails.sh runs a BASELINE RATCHET: each check has a recorded
  # count and the build fails when it goes UP. New violations are blocked from
  # today; existing ones are counted and can only be paid down. A baseline
  # raised in a diff is the one thing to challenge in review.
  guardrails:
    name: Static guardrails (blocking ratchet)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      # ⚠️ NOT the default checkout, and the reason is the whole point of this
      # job. The three matched-pair checks in guardrails.sh diff HEAD against
      # `git merge-base origin/master HEAD`. At the default fetch-depth of 1
      # that ref does not exist on a runner, so all three printed
      #   "skip … no origin/master to diff against (runs in CI)"
      # — a message naming CI as where they run, on the one host where they did
      # not. Measured on two real runs rather than reasoned about:
      #   pull_request 35487378044 → skip, skip, skip
      #   push master  35456540646 → ok (engine hunks: 0, oracle hunks: 0) ×3
      # On master origin/master IS HEAD, so the "ok" was a pass over an empty
      # diff. Between the two, a one-sided edit had never once been compared on
      # a pull request, which is the only event where catching it still helps.
      #
      # `filter: blob:none` rather than a plain `fetch-depth: 0`, because full
      # history is not free on this repo. Measured 2026-09-20 (662 commits, 41
      # branches), cloning from GitHub:
      #   depth 1 (what this job did)     1 s   .git   6 MB
      #   blob:none + full history        2 s   .git   7 MB   ← this
      #   full history                    5 s   .git  96 MB
      # A blobless partial clone carries the entire commit graph, so merge-base
      # cannot come back empty, and file contents arrive on demand — only for
      # the five paths the pair checks actually diff. A plain fetch-depth: 0
      # would pull 96 MB of historical blobs this job never opens, 89 MB of it
      # to answer a question about five files.
      #
      # ⚠️ Do not "simplify" this back to a bare checkout. guardrails.sh now
      # treats a missing origin/master as FATAL when GITHUB_ACTIONS is set, so
      # dropping these two lines fails the job loudly instead of quietly
      # skipping — which is the intended trade, but it is still a broken build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: ./scripts/guardrails.sh

      # scripts/gate-run.sh is the shared helper for RUNNING a gate: it takes
      # the exit code before anything can print over it, reads what the gate
      # printed, and will refuse a pass that shows no working. It rides in this
      # job because it needs nothing but bash and coreutils and takes ~2s.
      #
      # The second line is a MUTATION run. It sabotages a COPY of the helper —
      # once with the printed-failure scan stubbed out, once with the
      # proof-of-run check stubbed out — and requires the suite to go red
      # against each. THE RED TEXT INSIDE THAT STEP IS THE EVIDENCE, not a
      # problem: the step is green only when both sabotages were caught. A
      # helper written to catch checks that cannot fail, never once watched
      # failing, would be the joke writing itself.
      - name: Gate helper proof + mutation run (expected reds inside)
        run: |
          ./scripts/gate-run.test.sh
          ./scripts/gate-run.test.sh --prove-red

  # ---------- Service-worker e2e (ADR-049 gate 1) ----------
  # ADR-049 found that this repo had NINE CI jobs and none of them ran
  # Playwright, so every test guarding the service worker was hand-run only.
  # That is the `guardrails.sh` trap again, sitting on the failure mode
  # ADR-019's own pre-mortem calls the worst class we ship: a stale precache
  # stranding users on an old build with no code left to evict them.
  #
  # Running these does NOT activate anything. The service worker still ships
  # dark — VITE_ENABLE_SW is unset in every real build, and `no-sw-default`
  # below is what pins that. This job only makes the existing tests run.
  #
  # Two halves of one guarantee, and both are needed:
  #   sw-lifecycle  — against a VITE_ENABLE_SW=1 build: registration, the
  #                   precache holding shell + WASM, an offline reload, and
  #                   both skew-guard cases (mismatch raises exactly one
  #                   console.error; a matching version.json stays silent).
  #   no-sw-default — against a DEFAULT build: no registration at all. This is
  #                   the one that would catch the flag being switched on by
  #                   accident, which is the expensive direction.
  #
  # Chromium only: the SW paths are Chromium-specific here and the harness
  # pins one browser (playwright.sw.config.ts, workers: 1). ~30s of tests on
  # top of two builds; the builds are the cost, not the specs.
  service-worker-e2e:
    name: Service worker e2e (dark default + precache lifecycle)
    runs-on: ubuntu-latest
    needs: rust
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show   # toolchain pinned by rust-toolchain.toml (ADR-038)
      - uses: Swatinem/rust-cache@v2
      # Pinned for the same reason as the `web` job — see the long note there.
      # "latest" resolved two different ways eighteen minutes apart on 09-02.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # pkg/ must exist before either build: the app imports `stamp_tool`.
      - run: pnpm run build:wasm
      - name: Default build never registers a service worker
        run: pnpm exec playwright test e2e/no-sw-default.spec.ts
      - name: Precache lifecycle + build-skew guard (VITE_ENABLE_SW=1 build)
        run: pnpm run test:e2e:sw
